<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit Item' if item else 'Post an Item' }}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="{{ url_for('static', filename='form_submission.js') }}"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-blue-600 mb-4">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Go back
    </a>
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">{{ 'Edit Item' if item else 'List a New Item' }}</h2>

        <p id="message" class="mb-4 text-sm text-red-500"></p>

        <form action="{{ '/api/items/%d/edit' % item.id if item else '/items' }}" method="POST" id="list-item-form" class="space-y-4" novalidate>

            <div>
                <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
                <input type="text" id="title" name="item-title" required value="{{ item.title if item else '' }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                <p id="title-error" class="mt-1 text-xs text-red-500 hidden">Please enter a title.</p>
            </div>

            <div>
                <label for="description" class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                <textarea id="description" name="description" rows="4" required
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">{{ item.description if item else '' }}</textarea>
                <p id="description-error" class="mt-1 text-xs text-red-500 hidden">Please enter a description.</p>
            </div>

            <div>
                <label for="category" class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
                <select id="category" name="category" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    <option value="">-- Select a category --</option>
                    {% for value, label in [("lost", "Lost"), ("found", "Found"), ("trade", "Trade")] %}
                    <option value="{{ value }}"{{ ' selected' if item and item.category == value else '' }}>{{ label }}</option>
                    {% endfor %}
                </select>
                <p id="category-error" class="mt-1 text-xs text-red-500 hidden">Please select a category.</p>
            </div>

            <div>
                <label for="image" class="block text-sm font-semibold text-gray-700 mb-1">Photo <span class="font-normal text-gray-400">(optional)</span></label>
                <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/gif, image/webp"
                       class="w-full text-sm text-gray-600 border border-gray-300 rounded-lg cursor-pointer file:mr-3 file:py-2 file:px-4 file:border-0 file:bg-blue-50 file:text-blue-700 file:font-medium hover:file:bg-blue-100">
                <p class="mt-1 text-xs text-gray-400">PNG, JPG, GIF or WEBP, up to 5 MB.</p>
                <p id="image-error" class="mt-1 text-xs text-red-500 hidden"></p>
                <input type="hidden" id="remove-image" name="remove_image" value="">
                <div id="image-preview-wrap" class="mt-3 {{ '' if item and item.image_url else 'hidden' }} relative">
                    <img id="image-preview" alt="Selected photo preview"{% if item and item.image_url %} src="{{ item.image_url }}"{% endif %} class="w-full max-h-64 object-contain rounded-lg border border-gray-200 bg-gray-50">
                    <button type="button" id="image-remove"
                            class="absolute top-2 right-2 bg-white/90 hover:bg-white text-gray-600 text-xs font-medium px-2 py-1 rounded shadow cursor-pointer">
                        Remove
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition duration-200 mt-2 cursor-pointer">
                {{ 'Save Changes' if item else 'Post Item' }}
            </button>

        </form>
    </div>

    <script>
        const listItemForm = document.getElementById("list-item-form");

        listItemForm.addEventListener("submit", function (e) {

            e.preventDefault();  // Prevent form submission for validation

            let valid = true;

            const title    = document.getElementById("title");
            const titleErr = document.getElementById("title-error");
            const titleOk  = title.value.trim().length > 0;
            titleErr.classList.toggle("hidden", titleOk);
            if (!titleOk && valid) { valid = false; title.focus(); }

            const description    = document.getElementById("description");
            const descriptionErr = document.getElementById("description-error");
            const descriptionOk  = description.value.trim().length > 0;
            descriptionErr.classList.toggle("hidden", descriptionOk);
            if (!descriptionOk && valid) { valid = false; description.focus(); }

            const category    = document.getElementById("category");
            const categoryErr = document.getElementById("category-error");
            const categoryOk  = category.value.length > 0;
            categoryErr.classList.toggle("hidden", categoryOk);
            if (!categoryOk && valid) { valid = false; category.focus(); }

            const imageOk = validateImage();
            if (!imageOk && valid) { valid = false; imageInput.focus(); }

            if (!valid) return;

            handleFormSubmission(listItemForm.getAttribute("action"), listItemForm);
        });

        // ── Clear field errors on input ────────────────────────────────────────
        document.getElementById("title").addEventListener("input", () => {
            document.getElementById("title-error").classList.add("hidden");
        });
        document.getElementById("description").addEventListener("input", () => {
            document.getElementById("description-error").classList.add("hidden");
        });
        document.getElementById("category").addEventListener("change", () => {
            document.getElementById("category-error").classList.add("hidden");
        });

        // ── Image picker with preview ──────────────────────────────────────────
        const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
        const ALLOWED_IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
        const imageInput       = document.getElementById("image");
        const imageErr         = document.getElementById("image-error");
        const imagePreviewWrap = document.getElementById("image-preview-wrap");
        const imagePreview     = document.getElementById("image-preview");
        const removeImageInput = document.getElementById("remove-image");

        function validateImage() {
            const file = imageInput.files[0];
            let error = "";
            if (file && !ALLOWED_IMAGE_TYPES.includes(file.type)) {
                error = "Please choose a PNG, JPG, GIF or WEBP image.";
            } else if (file && file.size > MAX_IMAGE_BYTES) {
                error = "Image is too large. Maximum size is 5 MB.";
            }
            imageErr.textContent = error;
            imageErr.classList.toggle("hidden", !error);
            return !error;
        }

        // When editing, the item's current photo (if any) is shown until replaced or removed
        const existingImageUrl = imagePreview.getAttribute("src");

        function showPreview(src) {
            if (imagePreview.src.startsWith("blob:")) URL.revokeObjectURL(imagePreview.src);
            if (src) {
                imagePreview.src = src;
            } else {
                imagePreview.removeAttribute("src");
            }
            imagePreviewWrap.classList.toggle("hidden", !src);
        }

        function currentImage() {
            return removeImageInput.value === "1" ? null : existingImageUrl;
        }

        function clearImage() {
            imageInput.value = "";
            imageErr.classList.add("hidden");
            removeImageInput.value = "1";  // when editing, drop the existing photo
            showPreview(null);
        }

        imageInput.addEventListener("change", () => {
            const file = imageInput.files[0];
            if (!file || !validateImage()) {
                showPreview(file ? null : currentImage());
                return;
            }
            showPreview(URL.createObjectURL(file));
        });

        document.getElementById("image-remove").addEventListener("click", clearImage);
    </script>
</body>
</html>
