<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post an Item</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-blue-600 mb-4">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Go back
    </a>
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">List a New Item</h2>

        <form action="/items" method="POST" id="list-item-form" class="space-y-4" novalidate>

            <div>
                <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
                <input type="text" id="title" name="item-title" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                <p id="title-error" class="mt-1 text-xs text-red-500 hidden">Please enter a title.</p>
            </div>

            <div>
                <label for="description" class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                <textarea id="description" name="description" rows="4" required
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></textarea>
                <p id="description-error" class="mt-1 text-xs text-red-500 hidden">Please enter a description.</p>
            </div>

            <div>
                <label for="category" class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
                <select id="category" name="category" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    <option value="">-- Select a category --</option>
                    <option value="lost">Lost</option>
                    <option value="found">Found</option>
                    <option value="trade">Trade</option>
                </select>
                <p id="category-error" class="mt-1 text-xs text-red-500 hidden">Please select a category.</p>
            </div>

            <div>
                <label for="image_url" class="block text-sm font-semibold text-gray-700 mb-1">Image URL (to be changed)</label>
                <input type="url" id="image_url" name="image_url" placeholder="https://example.com/image.jpg"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg shadow transition duration-200 mt-2 cursor-pointer">
                Post Item
            </button>

        </form>
    </div>

    <script>
        const listItemForm = document.getElementById("list-item-form");

        listItemForm.addEventListener("submit", function (e) {

            e.preventDefault();  // Prevent form submission for validation

            let valid = true;

            const title    = document.getElementById("title");
            const titleErr = document.getElementById("title-error");
            const titleOk  = title.value.trim().length > 0;
            titleErr.classList.toggle("hidden", titleOk);
            if (!titleOk && valid) { valid = false; title.focus(); }

            const description    = document.getElementById("description");
            const descriptionErr = document.getElementById("description-error");
            const descriptionOk  = description.value.trim().length > 0;
            descriptionErr.classList.toggle("hidden", descriptionOk);
            if (!descriptionOk && valid) { valid = false; description.focus(); }

            const category    = document.getElementById("category");
            const categoryErr = document.getElementById("category-error");
            const categoryOk  = category.value.length > 0;
            categoryErr.classList.toggle("hidden", categoryOk);
            if (!categoryOk && valid) { valid = false; category.focus(); }

            if (!valid) return;

            listItemForm.submit();
        });

        // ── Clear field errors on input ────────────────────────────────────────
        document.getElementById("title").addEventListener("input", () => {
            document.getElementById("title-error").classList.add("hidden");
        });
        document.getElementById("description").addEventListener("input", () => {
            document.getElementById("description-error").classList.add("hidden");
        });
        document.getElementById("category").addEventListener("change", () => {
            document.getElementById("category-error").classList.add("hidden");
        });
    </script>
</body>
</html>
